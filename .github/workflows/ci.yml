name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run TypeScript compiler
        run: npm run typecheck
  
  vendored-audit:
    name: Vendored proba-audit matches pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned proba-audit commit
        id: pin
        run: echo "sha=$(tr -d '[:space:]' < src/audit/vendor/proba-audit/UPSTREAM_COMMIT)" >> "$GITHUB_OUTPUT"

      - name: Check out proba-audit at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: smallseedlabs/proba-audit
          ref: ${{ steps.pin.outputs.sha }}
          path: .proba-audit-pin

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fails when the vendored emitter/outbox/relay/publisher files differ from
      # upstream (beyond the documented edits) or when an unlisted file appears.
      - name: Diff vendored copy against the pinned proba-audit commit
        run: node scripts/check-vendored-audit.mjs .proba-audit-pin

  compose-security:
    name: Compose security (loopback ports, no default passwords)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Resolves docker-compose.yml and fails if a published port is not bound to 127.0.0.1, a password has a default
      # (or a literal), or a required password variable is not really required.
      - name: Check docker-compose.yml
        run: node scripts/check-compose-security.mjs

  validate-scenarios:
    name: Validate Scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Validate scenario files
        run: npm run validate:scenarios

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests (fails on any skipped/todo test)
        run: npm run test:ci

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: proba
          POSTGRES_PASSWORD: proba
          POSTGRES_DB: proba_hub_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    env:
      DATABASE_URL: postgresql://proba:proba@localhost:5432/proba_hub_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      LOG_LEVEL: warn
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      # Uses the compiled entry point (what the production image runs), so a
      # missing .sql file in dist/ fails CI.
      - name: Run migrations (compiled entry point)
        run: npm run migrate:prod
      
      # Runs every *.integration.test.ts (scenarios, answer flow, jsonb, API incl.
      # concurrency, SSE over a real HTTP server). The report check fails the job
      # if anything is skipped/todo or if the SSE/concurrency suites did not run.
      - name: Run integration tests (SSE + concurrency required, 0 skipped)
        run: npm run test:integration:ci

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: test-reports/
          if-no-files-found: ignore

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: proba-hub:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
