version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: proba
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: proba_hub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proba-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proba"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - postgres_password

  redis:
    image: redis:7-alpine
    environment:
      REDIS_USER: ${REDIS_USER:-proba}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    # An ACL user with a password; the `default` user (no password) is switched off. The Redis service is not published: only
    # services on proba-network reach it. AOF persistence ON: the audit stream must survive a Redis restart.
    command:
      - sh
      - -c
      - >-
        umask 077 &&
        printf 'user default off\nuser %s on >%s ~* &* +@all -@dangerous\n' "$$REDIS_USER" "$$REDIS_PASSWORD" > /tmp/users.acl &&
        exec redis-server --aclfile /tmp/users.acl --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    networks:
      - proba-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --user "$$REDIS_USER" ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5

  hub:
    image: ${REGISTRY:-ghcr.io/smallseedlabs}/proba-hub:${VERSION:-latest}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://proba:${POSTGRES_PASSWORD}@postgres:5432/proba_hub
      # An ACL user and password (the Hub refuses to start in production without one). Use rediss:// for a Redis outside this network.
      REDIS_URL: redis://${REDIS_USER:-proba}:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      CORS_ORIGIN: ${CORS_ORIGIN}
      LOG_LEVEL: info
      MOCK_BRAIN_SCENARIO: ${MOCK_BRAIN_SCENARIO:-happy_path}
    networks:
      - proba-network
    # Swarm cannot bind a published port to one address: this port is reachable on every node address. Put a TLS reverse proxy or a
    # firewall rule in front of it, and do not publish Postgres or Redis (they are not).
    ports:
      - "3000:3000"
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    secrets:
      - jwt_secret
      - postgres_password

  # One-shot job: applies pending SQL migrations with the compiled entry point,
  # then exits. Docker 20.10+. Run it BEFORE rolling out new hub replicas:
  #   docker stack deploy -c deploy/stack.yml proba   (job runs on each deploy)
  # or manually: docker service create --restart-condition none ... node dist/db/migrate-cli.js
  # Concurrent runners are serialized by a Postgres advisory lock.
  migrate:
    image: ${REGISTRY:-ghcr.io/smallseedlabs}/proba-hub:${VERSION:-latest}
    command: ["node", "dist/db/migrate-cli.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://proba:${POSTGRES_PASSWORD}@postgres:5432/proba_hub
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      LOG_LEVEL: info
    networks:
      - proba-network
    deploy:
      mode: replicated-job
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    secrets:
      - jwt_secret

networks:
  proba-network:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
  redis_data:

secrets:
  postgres_password:
    external: true
  jwt_secret:
    external: true
