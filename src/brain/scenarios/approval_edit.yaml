name: approval_edit
description: User edits approval from +20% to +10%

steps:
  - trigger:
      type: create_goal
    goal:
      status: active
      progress:
        completed: 0
        total: 3
        milestones:
          - name: Plan approved
            completed: false
          - name: Budget agreed
            completed: false
          - name: Campaign live
            completed: false
    outputs:
      - type: plan
        title: Simple Campaign Plan
        description: One-step campaign
        steps:
          - id: step1
            title: Launch campaign
            description: Deploy campaign
            estimatedCost: 100
        totalCost: 100

  - trigger:
      type: approve_plan
      approved: true
    goal:
      status: active
      progress:
        completed: 1
        total: 3
        milestones:
          - name: Plan approved
            completed: true
          - name: Budget agreed
            completed: false
          - name: Campaign live
            completed: false
    outputs:
      - type: tool_call
        tool: adjust_budget
        parameters:
          dailyBudget: 120
        needsApproval: true
        risk: medium
        costImpact:
          current: 100
          proposed: 120

  # Decline branch: a declined budget does not launch.
  - trigger:
      type: answer_ask
      askType: action_approval
      choice: reject
    goal:
      status: paused
    outputs:
      - type: reply
        text: Understood. The budget change was declined, so the campaign will not launch. Tell me what budget would work and I will propose it again.

  - trigger:
      type: answer_ask
      askType: action_approval
      choice: edit
    goal:
      status: active
      progress:
        completed: 3
        total: 3
        milestones:
          - name: Plan approved
            completed: true
          - name: Budget agreed
            completed: true
          - name: Campaign live
            completed: true
      metrics:
        spend: 41.2
        impressions: 6120
        clicks: 188
        conversions: 9
    outputs:
      - type: reply
        text: Understood. I'll use your adjusted budget of $110/day (+10%)
      - type: decision
        decision: keep
        target: Campaign
        evidence:
          - Budget adjusted per your preference
          - Conservative increase approach
        confidence: 0.90
