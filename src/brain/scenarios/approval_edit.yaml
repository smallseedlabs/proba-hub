name: approval_edit
description: User edits approval from +20% to +10%

steps:
  - trigger:
      type: create_goal
    outputs:
      - type: plan
        title: Simple Campaign Plan
        description: One-step campaign
        steps:
          - id: step1
            title: Launch campaign
            description: Deploy campaign
            estimatedCost: 100
        totalCost: 100

  - trigger:
      type: approve_plan
      approved: true
    outputs:
      - type: tool_call
        tool: adjust_budget
        parameters:
          dailyBudget: 120
        needsApproval: true
        risk: medium
        costImpact:
          current: 100
          proposed: 120

  - trigger:
      type: answer_ask
      askType: action_approval
      choice: edit
    outputs:
      - type: reply
        text: Understood. I'll use your adjusted budget of $110/day (+10%)
      - type: decision
        decision: keep
        target: Campaign
        evidence:
          - Budget adjusted per your preference
          - Conservative increase approach
        confidence: 0.90
