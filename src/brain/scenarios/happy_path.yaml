name: happy_path
description: Happy path conversation flow with clarification, plan, approval, and decision

# Optional `goal:` blocks are mock-only: the Hub turns them into goal_updated
# events (progress + campaign metrics) after the step's outputs.
steps:
  - trigger:
      type: create_goal
    goal:
      status: active
      progress:
        completed: 0
        total: 4
        milestones:
          - name: Audience confirmed
            completed: false
          - name: Plan approved
            completed: false
          - name: Budget approved
            completed: false
          - name: Campaign live
            completed: false
    outputs:
      - type: clarify
        reason: Need clarification on target audience
        questions:
          - id: audience
            text: Who should see these ads?
            type: choice
            options:
              - value: all
                label: All existing users
              - value: active
                label: Active users (logged in last 30 days)
              - value: power
                label: Power users only

  - trigger:
      type: answer_ask
      askType: clarify
    goal:
      status: active
      progress:
        completed: 1
        total: 4
        milestones:
          - name: Audience confirmed
            completed: true
          - name: Plan approved
            completed: false
          - name: Budget approved
            completed: false
          - name: Campaign live
            completed: false
    outputs:
      - type: plan
        title: Campaign Launch Plan
        description: 3-step campaign for active users
        steps:
          - id: step1
            title: Create ad creative
            description: Design 3 ad variants highlighting the new feature
            estimatedCost: 30
          - id: step2
            title: Configure targeting
            description: Set up audience segment for active users
            estimatedCost: 20
          - id: step3
            title: Launch campaign
            description: Deploy campaign with daily budget
            estimatedCost: 3000
        totalCost: 3050

  - trigger:
      type: approve_plan
      approved: true
    goal:
      status: active
      progress:
        completed: 2
        total: 4
        milestones:
          - name: Audience confirmed
            completed: true
          - name: Plan approved
            completed: true
          - name: Budget approved
            completed: false
          - name: Campaign live
            completed: false
      metrics:
        spend: 0
        impressions: 0
        clicks: 0
        conversions: 0
    outputs:
      - type: tool_call
        tool: adjust_budget
        parameters:
          dailyBudget: 120
        needsApproval: true
        risk: medium
        costImpact:
          current: 100
          proposed: 120

  - trigger:
      type: answer_ask
      askType: action_approval
    goal:
      status: active
      progress:
        completed: 4
        total: 4
        milestones:
          - name: Audience confirmed
            completed: true
          - name: Plan approved
            completed: true
          - name: Budget approved
            completed: true
          - name: Campaign live
            completed: true
      metrics:
        spend: 84.5
        impressions: 12840
        clicks: 412
        conversions: 23
    outputs:
      - type: reply
        text: Launching campaign with adjusted budget
      - type: decision
        decision: keep
        target: Campaign
        evidence:
          - Campaign performance is meeting KPIs
          - Cost per conversion within target
          - Click-through rate above industry average
          - Budget utilization is optimal
        confidence: 0.87
        recommendation: Continue campaign with current settings. Consider slight creative refresh in 2 weeks.
