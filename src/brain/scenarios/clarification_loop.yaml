name: clarification_loop
description: Multiple clarification rounds, capped at 2

steps:
  - trigger:
      type: create_goal
    outputs:
      - type: clarify
        reason: Need more details about your product
        questions:
          - id: product
            text: What product are you advertising?
            type: text

  - trigger:
      type: answer_ask
      askType: clarify
      round: 1
    outputs:
      - type: clarify
        reason: Need to know your target market
        questions:
          - id: market
            text: Who is your target market?
            type: text

  - trigger:
      type: answer_ask
      askType: clarify
      round: 2
    outputs:
      - type: reply
        text: Thank you for the clarifications. Creating your campaign plan now.
      - type: plan
        title: Campaign Plan
        description: Based on your inputs
        steps:
          - id: step1
            title: Create campaign
            description: Launch targeted campaign
            estimatedCost: 1000
        totalCost: 1000
